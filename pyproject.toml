[project]
name = "nasa-hackathon"
version = "0.1.0"
description = "Back-end code for team astronomy x problem 10"
readme = "README.md"
authors = [
    { name = "mohammedali", email = "mohammedalimustafa@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.19.0",
    "fastapi[standard]>=0.162.7",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "rioxarray>=0.23.0",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[project.scripts]
nasa-hackathon = "nasa_hackathon:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
